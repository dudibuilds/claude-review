# CI for xrepo-review itself: typecheck, unit tests, build, policy validation, image build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install ripgrep (used by the xsearch tests)
        run: |
          command -v rg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; }
          rg --version

      - run: npm ci --no-audit --no-fund
      # src/ (tsconfig.json) and test/ (tsconfig.test.json): vitest strips types without checking
      # them, so a test double (fake GitHubApi, hand-built PrContext / ResolvedPolicy) that drifts
      # from a shared interface would otherwise pass unnoticed.
      - run: npm run typecheck
      - name: Tests
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: npm test
      - run: npm run build
      - name: Validate example and e2e policies
        run: |
          node dist/cli.js policy validate examples/policy.yaml
          node dist/cli.js policy validate e2e/policy.yaml
          node dist/cli.js policy tools examples/policy.yaml acme/payments

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the image
        run: docker build -f docker/Dockerfile -t xrepo-review:ci .
      - name: Smoke-test with the production hardening flags
        run: |
          set -euo pipefail
          flags=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
                 --pids-limit 256 --memory 1g --user 65534:65534 --tmpfs "/tmp:rw,noexec,nosuid,size=64m")
          docker run "${flags[@]}" xrepo-review:ci --version
          # The verified toolchain: ripgrep >= 14.1, git >= 2.43 (git < 2.40 has no --attr-source).
          at_least() { [[ "$3" =~ ^[0-9]+\.[0-9]+ ]] && [ "$(printf '%s\n%s\n' "$2" "$3" | sort -V | head -n1)" = "$2" ] || { echo "::error::$1 '$3' is not >= $2"; exit 1; }; }
          rg_version=$(docker run "${flags[@]}" --entrypoint rg xrepo-review:ci --version | awk 'NR==1 {print $2}')
          git_version=$(docker run "${flags[@]}" --entrypoint git xrepo-review:ci --version | awk '{print $3}')
          at_least ripgrep 14.1 "$rg_version"
          at_least git 2.43 "$git_version"
          docker run "${flags[@]}" -v "$PWD/examples:/examples:ro" xrepo-review:ci policy validate /examples/policy.yaml
      - name: MCP servers in hardened containers (prepare's docker launcher)
        env:
          XREPO_TEST_DOCKER_IMAGE: xrepo-review:ci
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: npx vitest run test/prepare.test.ts test/e2e.test.ts -t "docker launcher"
