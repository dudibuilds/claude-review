# xrepo-sync: keeps the read-only repository mirror fresh (`xrepo sync`).
#
# The mirror is local disk on the review runners' host (/srv/xrepo/mirror), so this must run on
# a runner of THAT host: give one runner there the label `xrepo-sync` (or set the repository
# variable XREPO_SYNC_RUNNER_LABELS). With several hosts, run one sync per host (one labelled runner
# each, or a systemd timer calling `xrepo sync` — preferred when review runners are ephemeral,
# because the mirror must be writable ONLY by the sync identity and read-only to review jobs).
#
# Token: a GitHub App installation token with contents:read on the mirrored repositories, minted
# per run (never stored). Configure vars.XREPO_APP_CLIENT_ID and secrets.XREPO_APP_PRIVATE_KEY.
# An installation token covers ONE account (organization or user), so the App must be installed on
# every owner named in the policy's mirror.repos, and the sync runs once per owner: the `owners` job
# reads those owners from the policy, then one `sync` job per owner mints that owner's token and,
# when the policy names more than one owner, runs `xrepo sync --owner <owner>` (only that owner's
# repositories are synced or removed). A policy with a single owner runs exactly one unrestricted
# `xrepo sync`, as before.
name: xrepo-sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xrepo-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  owners:
    # On the sync host: that is where the policy file lives.
    runs-on: ${{ fromJSON(vars.XREPO_SYNC_RUNNER_LABELS || '["self-hosted","xrepo-sync"]') }}
    timeout-minutes: 10
    outputs:
      owners: ${{ steps.owners.outputs.owners }}
      scoped: ${{ steps.owners.outputs.scoped }}
    steps:
      # This repository at the workflow's commit (default branch for schedule) = trusted code.
      - name: Check out xrepo-review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # owners = JSON array of the accounts in mirror.repos ("owner/name", "owner/*"; first spelling
      # wins, case-insensitively), or this repository's owner when it names none (the run then only
      # removes mirrors the policy dropped). scoped = more than one owner.
      - name: Owners named in mirror.repos
        id: owners
        env:
          POLICY: ${{ vars.XREPO_POLICY_PATH || '/etc/xrepo-review/policy.yaml' }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          out="$(node --input-type=module - <<'JS'
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          const { loadPolicy } = await import(pathToFileURL(resolve("dist/policy/load.js")).href);
          const policy = loadPolicy(process.env.POLICY);
          const OWNER = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$/;
          const owners = new Map();
          for (const entry of policy.mirror.repos) {
            const parts = entry.trim().split("/");
            const owner = parts[0] ?? "";
            if (parts.length !== 2 || !OWNER.test(owner) || owners.has(owner.toLowerCase())) continue;
            owners.set(owner.toLowerCase(), owner);
          }
          const list = [...owners.values()];
          console.log(`owners=${JSON.stringify(list.length > 0 ? list : [process.env.REPO_OWNER])}`);
          console.log(`scoped=${list.length > 1}`);
          JS
          )"
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  sync:
    needs: owners
    name: sync (${{ matrix.owner }})
    runs-on: ${{ fromJSON(vars.XREPO_SYNC_RUNNER_LABELS || '["self-hosted","xrepo-sync"]') }}
    timeout-minutes: 30
    strategy:
      # One owner at a time (the runs share the mirror's lock); one owner's failure (e.g. the App
      # is not installed there) does not stop the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.owners.outputs.owners) }}
    steps:
      - name: Check out xrepo-review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Mint a read-only GitHub App token for this owner
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.XREPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.XREPO_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          permission-contents: read
          permission-metadata: read

      - name: Sync the mirror
        env:
          XREPO_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          POLICY: ${{ vars.XREPO_POLICY_PATH || '/etc/xrepo-review/policy.yaml' }}
          MIRROR: ${{ vars.XREPO_MIRROR_PATH || '/srv/xrepo/mirror' }}
          OWNER: ${{ matrix.owner }}
          SCOPED: ${{ needs.owners.outputs.scoped }}
        run: |
          set -uo pipefail
          args=(sync --policy "$POLICY" --mirror "$MIRROR")
          # Several owners: this job's token reads only $OWNER's repositories, so it syncs (and
          # removes) only those; every other owner has its own job and token.
          if [ "$SCOPED" = true ]; then args+=(--owner "$OWNER"); fi
          rc=0
          node dist/cli.js "${args[@]}" || rc=$?
          # 3 = another sync holds the lock (still running): not an error for a schedule.
          if [ "$rc" -eq 3 ]; then echo "::notice::another xrepo sync is running"; exit 0; fi
          exit "$rc"
